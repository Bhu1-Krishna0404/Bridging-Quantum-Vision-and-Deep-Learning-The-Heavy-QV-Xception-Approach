<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Heavy QV-Xception</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(to right, #141e30, #243b55); color:#fff; font-family:'Segoe UI', sans-serif;}
    .navbar { background:linear-gradient(90deg,#0f2027,#203a43,#2c5364); padding:15px 25px; box-shadow:0 4px 15px rgba(0,0,0,0.4);}
    .navbar-brand { font-weight:bold; font-size:1.4rem; color:#f1c40f !important;}
    .navbar-nav .nav-link { color:#fff !important; margin:0 8px; transition:0.3s;}
    .navbar-nav .nav-link:hover { color:#f1c40f !important; text-shadow:0 0 8px rgba(241,196,15,0.7);}
    .form-card { margin:80px auto; max-width:400px; background:#fff; color:#000; padding:30px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.3);}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('home') }}">Heavy QV-Xception</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('register') }}">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="form-card">
      <h3 class="fw-bold text-center mb-4">Register</h3>
      <form method="POST">
        <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-dark w-100">Register</button>
        <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
      </form>
    </div>
  </div>
</body>
</html>
