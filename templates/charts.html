<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Charts | Heavy QV-Xception</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { background: linear-gradient(to right,#141e30,#243b55); color:#fff; font-family:'Segoe UI',sans-serif;}
.navbar{background:linear-gradient(90deg,#0f2027,#203a43,#2c5364);padding:15px 25px;box-shadow:0px 4px 15px rgba(0,0,0,0.4);}
.navbar-brand{font-weight:bold;font-size:1.4rem;color:#f1c40f !important;}
.navbar-nav .nav-link{color:#fff !important;margin:0 8px;transition:0.3s;}
.navbar-nav .nav-link:hover, .navbar-nav .nav-link.active{color:#f1c40f !important;text-shadow:0px 0px 8px rgba(241,196,15,0.7);}
.card{border-radius:15px;padding:20px;background:#fff;color:#000;box-shadow:0px 8px 20px rgba(0,0,0,0.3);margin-bottom:30px; display:flex; flex-direction:column; justify-content:center; align-items:center;}
.chart-container{width:100%; height:500px; display:flex; justify-content:center; align-items:center;}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
<div class="container-fluid">
<a class="navbar-brand" href="{{ url_for('home') }}">Heavy QV-Xception</a>
<div class="collapse navbar-collapse justify-content-end">
<ul class="navbar-nav">
<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Upload</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('performance') }}">Performance</a></li>
<li class="nav-item"><a class="nav-link active" href="{{ url_for('charts') }}">Charts</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
</ul>
</div>
</div>
</nav>

<div class="container my-5 d-flex justify-content-center">
  <div class="col-md-6">
    <div class="card w-100">
      <h4 class="fw-bold mb-3 text-center">Training Dataset Distribution (Pie)</h4>
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// Data
const labels = [{% for class_name in training_distribution.keys() %}'{{ class_name }}',{% endfor %}];
const values = [{% for percent in training_distribution.values() %}{{ percent }},{% endfor %}];
const colors = ['#f1c40f','#e67e22','#1abc9c','#3498db','#9b59b6','#e74c3c'];

// Pie Chart
const pieCtx = document.getElementById('pieChart').getContext('2d');
new Chart(pieCtx, {
    type: 'pie',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderColor:'#fff', borderWidth:2 }] },
    options: {
        responsive:true,
        plugins:{
            legend:{ position:'bottom', labels:{color:'#000'} },
            title:{display:true,text:'Training Classes Distribution (Pie)', color:'#000', font:{size:18}}
        }
    }
});
</script>
</body>
</html>
