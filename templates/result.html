<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Result | Heavy QV-Xception</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(to right, #141e30, #243b55); color:#fff; font-family:'Segoe UI', sans-serif;}
    .navbar { background:linear-gradient(90deg,#0f2027,#203a43,#2c5364); padding:15px 25px; box-shadow:0 4px 15px rgba(0,0,0,0.4);}
    .navbar-brand { font-weight:bold; font-size:1.4rem; color:#f1c40f !important;}
    .navbar-nav .nav-link { color:#fff !important; margin:0 8px; transition:0.3s;}
    .navbar-nav .nav-link:hover { color:#f1c40f !important; text-shadow:0 0 8px rgba(241,196,15,0.7);}
    .result-card { margin:40px auto; max-width:700px; background:#fff; color:#000; padding:30px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.3); text-align:center;}
    .result-img { width:100%; max-height:300px; border-radius:10px; margin-bottom:20px; object-fit:contain;}
    h5, h6 { margin:5px 0; }
    .check-btn { 
      display:block; 
      margin:25px auto 0 auto; 
      background:#f1c40f; 
      color:#000; 
      font-weight:bold; 
      padding:12px 25px; 
      border-radius:10px; 
      text-decoration:none; 
      width:fit-content;
      text-align:center;
      transition:0.3s;
    }
    .check-btn:hover { background:#e0b90f; color:#000; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('home') }}">Heavy QV-Xception</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('performance') }}">Performance</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('charts') }}">Charts</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="result-card">
      <h3 class="fw-bold mb-4">Prediction Result</h3>
      <img src="{{ url_for('display_image', filename=filename) }}" class="result-img" alt="Uploaded Image">
      <h5>Predicted Class: <b>{{ prediction }}</b></h5>
      <h6>Confidence: {{ confidence }}</h6>

      <!-- Button definitely visible -->
      <a href="{{ url_for('index') }}" class="check-btn">Check Another Image</a>
    </div>
  </div>
</body>
</html>
